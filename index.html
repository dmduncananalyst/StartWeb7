<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartWeb7</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #7890A2;
    }
  </style>

  <script>
    (function () {
      var isMobile = window.matchMedia("(max-width: 760px)").matches;
      var destination = isMobile
        ? "startweb7_mobile(1).html"
        : "startweb7_desktop.html";

      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <noscript>
    <p>
      <a href="startweb7_desktop.html">Desktop site</a><br>
      <a href="startweb7_mobile(1).html">Mobile site</a>
    </p>
  </noscript>
</body>
</html>
